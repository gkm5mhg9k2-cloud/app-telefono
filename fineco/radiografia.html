<html lang="it">
<head>

<title>Portafoglio</title>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/icon-192.png"><meta name="theme-color" content="#171c27"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Portafoglio">
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#1a2331;--line:#344154;--ink:#eef3fa;--muted:#a1afc3;--accent:#8fb2ff;--bad:#f08083}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(100%,360px);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
.marchio{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#578dff,#375baf);color:#fff;font-size:23px;font-weight:800}
h1{margin:4px 0 0;font-size:21px;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:13px}
label{font-size:12px;color:var(--muted);margin-top:6px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%}
button{font:inherit;font-weight:650;color:#fff;background:#2852b3;border:0;border-radius:12px;padding:12px;cursor:pointer}
button[disabled]{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#errore{color:var(--bad);min-height:1.2em}
.nascosto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="sblocca" hidden>
<form id="modulo">
<span class="marchio" aria-hidden="true">P</span>
<h1>Portafoglio</h1>
<p>Pagina privata. Su questo dispositivo la password serve una volta sola.</p>
<input class="nascosto" type="text" name="username" autocomplete="username" value="Portafoglio" tabindex="-1" aria-hidden="true" readonly>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" id="apri">Apri</button>
<p id="errore" role="alert"></p>
</form>
</main>
